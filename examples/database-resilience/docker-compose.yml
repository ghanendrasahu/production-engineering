services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local-throwaway-NOT-for-production # dev compose only
    command:
      - postgres
      - -c
      - statement_timeout=3000 # 3s server-side statement timeout
      - -c
      - deadlock_timeout=500ms
    ports:
      - "127.0.0.1:55432:5432" # host-only; avoids clashing with any local Postgres on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 20
